
services:
  backend:
    build: ./backend
    container_name: walletpay-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
    ports:
      - "5001:5001"

  frontend:
    build: .
    container_name: walletpay-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
